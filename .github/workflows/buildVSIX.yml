name: Package VSCode Extension
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v1
        with:
          node-version: '12.x'
      - run: npm ci
      - run: npm install -g vsce
      - run: vsce package
      - uses: actions/upload-artifact@v2
        with:
          name: my-extension.vsix
          path: my-extension-*.vsix
