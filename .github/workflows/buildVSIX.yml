name: Package VSCode Extension
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm install -g vsce
      - run: vsce package
      - uses: actions/upload-artifact@v4
        with:
          name: my-extension.vsix
          path: my-extension-*.vsix
